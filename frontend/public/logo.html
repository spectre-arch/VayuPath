<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VayuPath Logo</title>
<style>
:root {
  --bg: #F3F8F7; --ink: #0B3C49; --wind: #7FB7BE;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #082A33; --ink: #E8F6F4; --wind: #4F8F98; } }
:root[data-theme="dark"] { --bg: #082A33; --ink: #E8F6F4; --wind: #4F8F98; }
html, body { height: 100%; margin: 0; }
body { cursor: pointer; background: var(--bg); color: var(--ink); display: grid; place-items: center; }
.logo { display: flex; align-items: center; gap: clamp(4px, 2vw, 20px); padding: 24px; flex-wrap: wrap; justify-content: center; }
.mark { width: clamp(110px, 24vw, 180px); height: auto; overflow: visible; }
.word { width: clamp(260px, 52vw, 520px); height: auto; fill: var(--ink); clip-path: inset(0 100% 0 0); animation: wipe 1.8s cubic-bezier(.65,.05,.25,1) 1.1s forwards; }
.route { fill: none; stroke: url(#aqi); stroke-width: 12; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.2s cubic-bezier(.6,.1,.2,1) .3s forwards; }
.leaf { transform: scale(0); animation: grow .7s cubic-bezier(.3,1.5,.5,1) 1.4s forwards; }
.leaf.two { animation-delay: 1.7s; }
.sway { animation: sway 4.5s ease-in-out 2.4s infinite; }
.sway.two { animation-duration: 5.5s; animation-delay: 2.8s; }
.pin { transform-origin: 170px 52px; transform: scale(0); animation: pop .5s cubic-bezier(.3,1.6,.5,1) 2.3s forwards; }
.start { opacity: 0; animation: fade .4s ease .2s forwards; }
@keyframes wipe { to { clip-path: inset(0 0 0 0); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@keyframes pop { to { transform: scale(1); } }
@keyframes grow { to { transform: scale(1); } }
@keyframes sway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(7deg); } }
@media (prefers-reduced-motion: reduce) { .sway { animation: none; } }
</style>
